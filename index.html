<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/avante_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Avante - Conectando profissionais veterinários com clientes" />
    <title>Avante</title>
    <meta name="theme-color" content="#162016" />
    <!-- Aplica o tema ANTES do React montar. Sem isto a tela pisca
         branca a cada carregamento, já que o escuro é o padrão. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('avante-theme')
          if (saved !== 'light') document.documentElement.classList.add('dark')
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
    <style>
      html.dark { background-color: #0f1511; }
      html.dark body { background-color: #0f1511; color: #e7e9e7; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
